AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB Tables for Leave Management System

Resources:

  # -------------------------------
  # Users Table
  # -------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Leave Types Table
  # -------------------------------
  LeaveTypesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LeaveTypes
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: name
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: name-index
          KeySchema:
            - AttributeName: name
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Leaves Table
  # -------------------------------
  LeavesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Leaves
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Leave Balances Table
  # -------------------------------
  LeaveBalancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LeaveBalances
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: year
          AttributeType: N

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: user-year-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: year
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Leave Logs Table
  # -------------------------------
  LeaveLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LeaveLogs
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: leaveId
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: leaveId-index
          KeySchema:
            - AttributeName: leaveId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Salary Table (NEW)
  # -------------------------------
  SalariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Salaries
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: effectiveFrom
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: userId-effectiveFrom-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: effectiveFrom
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Payroll Table (NEW)
  # -------------------------------
  PayrollsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Payrolls
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: year
          AttributeType: N
        - AttributeName: month
          AttributeType: N

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: userId-year-month-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: year
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: month-index
          KeySchema:
            - AttributeName: month
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------
  # Office Timing Table
  # -------------------------------
  OfficeTimingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OfficeTiming
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # -------------------------------
  # Attendance Table
  # -------------------------------
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Attendance
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: userId-date-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: date-index
          KeySchema:
            - AttributeName: date
              KeyType: HASH
          Projection:
            ProjectionType: ALL
    
    

