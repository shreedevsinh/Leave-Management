service: leave-management

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  timeout: 29
  memorySize: 1024
  environment:
    DATABASE_URL: ${env:DATABASE_URL}    # RDS / Prisma
    JWT_SECRET: ${env:JWT_SECRET}
    NODE_ENV: production

  # IAM Role Permissions
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        # DynamoDB
        - dynamodb:GetItem
        - dynamodb:Scan
        - dynamodb:Query
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchGetItem 
        - dynamodb:BatchWriteItem
      Resource:
        - "arn:aws:dynamodb:ap-south-1:*:table/LeaveTypes"
        - "arn:aws:dynamodb:ap-south-1:*:table/Users"
        - "arn:aws:dynamodb:ap-south-1:*:table/Leaves"

    - Effect: "Allow"
      Action:
        # Optional: S3, CloudWatch, etc.
        - "logs:CreateLogGroup"
        - "logs:CreateLogStream"
        - "logs:PutLogEvents"
      Resource: "*"

functions:
  auth:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /auth/{proxy+}
          method: ANY
  users:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /users/{proxy+}
          method: ANY
  leaves:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /leaves/{proxy+}
          method: ANY
  leaveTypes:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /leave-types/{proxy+}
          method: ANY

package:
  individually: true
  patterns:
    # Exclude unnecessary files
    - '!**/*.md'
    - '!**/*.map'
    - '!**/node_modules/aws-sdk/**'
    - '!**/node_modules/@prisma/engines/**'
    - '!**/node_modules/.prisma/client/query-engine-*' # Exclude all first

    # Include Prisma Client code and binaries for RDS
    - 'node_modules/@prisma/client/**'
    - 'node_modules/.prisma/client/**'
    - 'node_modules/.prisma/client/query-engine-rhel-openssl-1.0.x'
    - 'prisma/schema.prisma'

    # Include AWS SDK v3 for DynamoDB
    - 'node_modules/@aws-sdk/**'

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: node20          # Node 20 runtime
    platform: node
    keepNames: true
    external:
      - aws-sdk
      - fast-crc32c
      - '@node-rs/xxhash'
      - '@node-rs/crc32'
      - '@nestjs/microservices'
      - '@nestjs/websockets/socket-module'
      - sharp
      - bcrypt