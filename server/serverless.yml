service: leave-management-app

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: dev
  timeout: 29
  memorySize: 1024

  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    NODE_ENV: production

  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource:
        - 'arn:aws:dynamodb:ap-south-1:*:table/*'

    - Effect: Allow
      Action:
        - logs:*
      Resource: '*'

functions: ${file(../infrastructure/api/functions.yml)}

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!src/**'
    - '!test/**'
    - '!coverage/**'
    - '!**/*.map'
    - '!**/*.md'

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node

    # 🔥 THIS IS THE REAL FIX
    packages: external

resources:
  # - ${file(../infrastructure/dynamodb/tables.yml)}
  - ${file(../infrastructure/s3/frontend-bucket.yml)}
  - ${file(../infrastructure/s3/cloudfront.yml)}

  # - Outputs:
  #     HttpApiUrl:
  #       Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
