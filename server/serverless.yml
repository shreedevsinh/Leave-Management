service: leave-management-app

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  timeout: 29
  memorySize: 1024

  environment:
    NODE_ENV: production
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:5173'}

  httpApi:
    cors:
      allowedOrigins:
        - ${env:FRONTEND_URL, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "*"

    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:leave-management/production-new*

functions:
  ${file(../infrastructure/api/functions.yml)}

plugins:
  - serverless-esbuild

package:
  individually: true
  excludeDevDependencies: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    zipConcurrency: 1
    keepNames: true

resources:
  - ${file(../infrastructure/s3/cloudfront.yml)}
  - ${file(../infrastructure/secrets/secrets.yml)}